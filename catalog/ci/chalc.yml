# chalc:managed — generado por chalc; se regenera al equipar con --ci. No edites este archivo.
#
# Repite fuera de la máquina lo que no debe depender de quién lo corre: que las herramientas de
# .chalc/ no se alteraron y que la spec activa es coherente y está aprobada por una persona.
# No instala dependencias ni corre los tests del proyecto: eso es de tu propio CI.
name: chalc
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .chalc/gate.mjs --ci
